[project]
name = "derica"
version = "0.1.0"
description = "Reads market price messages in naira and local measures, then reprices per measure with deterministic code."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "tinker>=0.32.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
