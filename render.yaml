# Render blueprint. TINKER_API_KEY must be set in the Render dashboard (sync: false keeps it out of git).
services:
  - type: web
    name: derica
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run uvicorn derica.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TINKER_API_KEY
        sync: false
